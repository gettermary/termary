name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first — a quick look saves you writing this out twice.

        **Security problems don't go here.** Email security@termary.com instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a terminal in a group with…
        2. Start Claude Code
        3. …
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does this happen?
      options:
        - macOS app
        - iOS companion app
        - Windows app
        - Linux app
        - MCP server / termary CLI
        - Website / account
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Termary version
      description: macOS — Termary → About. Windows/Linux — `termary --version`.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      description: Pick the closest one — this is what routes the issue.
      options:
        - "Terminal, panes & splits"
        - "Tabs, groups & layout"
        - "Agent state detection (working / needs you)"
        - "Agent tools & MCP bridge"
        - "Browser pane"
        - "Editor & file preview"
        - "Files, Search & Git panel"
        - "SSH & saved hosts"
        - "Phone pairing & remote access"
        - "Terminal mirror on phone"
        - "Widget & Live Activity"
        - "Notifications & push"
        - "Themes & appearance"
        - "Account, Pro & billing"
        - "Fan-out & worktrees"
        - "Install, update & startup"
        - "Performance (slow, laggy, high CPU)"
        - "Crash or freeze"
        - "Something else / not sure"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Annoying but I can work around it"
        - "Blocks part of my workflow"
        - "I can't use Termary"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1 / Windows 11 23H2 / Ubuntu 24.04 / iOS 26.0"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Only if your issue involves an agent, networking, or the widget"

  - type: input
    id: agent-cli
    attributes:
      label: Agent CLI and version
      description: |
        Fill this in for anything about agent state — a tab stuck on "working", a missed
        "needs you", a wrong vendor badge. Detection depends on the CLI's exact TUI, so
        the version is usually the whole answer. `claude --version` / `codex --version`.
      placeholder: "Claude Code 2.1.198"

  - type: textarea
    id: agent-output
    attributes:
      label: What the agent's terminal showed
      description: |
        For a state-detection bug, paste the visible terminal text at the moment it went
        wrong — spinner line, prompt, whatever was on screen. This is the exact input
        needed to fix detection, and it's usually impossible to guess after the fact.
      render: shell

  - type: dropdown
    id: connection
    attributes:
      label: How was the phone connected?
      description: LAN and tunnel fail in different ways, so this narrows it a lot.
      options:
        - "Not relevant to this issue"
        - "LAN / Bonjour"
        - "Remote access (cloudflared tunnel)"
        - "Tailscale or other VPN"

  - type: input
    id: widget-diag
    attributes:
      label: Widget diagnostic line
      description: "Home Screen widget issues only — iOS app → Settings, copy the widget diagnostic line."

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, screen recordings, crash logs. Drag files in.
